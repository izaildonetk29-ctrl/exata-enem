<main>
<section class="hero"><h1>Ferramentas</h1><p>Calculadoras simples para conferir resultados durante o estudo.</p></section>
<div class="grid">
<div class="card"><h2>Calculadora De Porcentagem</h2><input id="n" type="number" placeholder="Valor"><input id="p" type="number" placeholder="Porcentagem" style="margin-top:10px"><button class="btn" style="margin-top:12px" onclick="calc()">Calcular</button><p id="res"></p></div>
<div class="card"><h2>Conversor De Comprimento</h2><input id="km" type="number" placeholder="Quilômetros"><button class="btn" style="margin-top:12px" onclick="conv()">Converter</button><p id="cres"></p></div>
</div>
<script>
function calc(){let n=+document.getElementById("n").value,p=+document.getElementById("p").value;document.getElementById("res").textContent="Resultado: "+(n*p/100);}
function conv(){let k=+document.getElementById("km").value;document.getElementById("cres").textContent=k+" km = "+(k*1000)+" m = "+(k*100000)+" cm";}
</script>
